version: '3.8'

services:
  # ==========================================
  # 1. BASE DE DONNÉES (MySQL)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: healthguardian-db
    restart: always
    environment:
      MYSQL_DATABASE: healthguardian_db
      MYSQL_ROOT_PASSWORD: rootpassword  # Mot de passe sécurisé pour la prod
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  # ==========================================
  # 2. PHPMYADMIN (Interface DB)
  # ==========================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: healthguardian-phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8082:80" # Accessible via http://localhost:8082

  # ==========================================
  # 3. BACKEND (Spring Boot)
  # ==========================================
  backend:
    image: sahlihanin/healthguardian-backend:latest
    container_name: healthguardian-backend
    restart: on-failure
    depends_on:
      - db
    environment:
      # Configuration SGBD
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/healthguardian_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      
      # Configuration JPA (Update pour ne pas perdre les données à chaque redémarrage)
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      
      # Configuration Serveur
      SERVER_PORT: 8081
      
      # Connexion avec le service IA
      AI_SERVICE_URL: http://ai-service:8000
      
      # CORS (Autoriser le frontend Dockerisé)
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8081:8081"

  # ==========================================
  # 4. SERVICE IA (Python/FastAPI/Uvicorn)
  # ==========================================
  ai-service:
    image: sahlihanin/healthguardian-ai:latest
    container_name: healthguardian-ai
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      # Si votre IA a besoin de se connecter à la DB ou au Backend, ajoutez les variables ici
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword

  # ==========================================
  # 5. FRONTEND (React/Nginx)
  # ==========================================
  frontend:
    image: sahlihanin/healthguardian-frontend:latest
    container_name: healthguardian-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80" # Mappé sur 3000 pour correspondre à vos habitudes (http://localhost:3000)
    environment:
      # Attention : Cette variable doit souvent être "baker" dans l'image au moment du build
      # ou injectée via un script au démarrage du conteneur Nginx si configuré.
      REACT_APP_API_URL: http://localhost:8081/api

  # ==========================================
  # 6. SONARQUBE (Code Quality)
  # ==========================================
  sonarqube:
    image: sonarqube:community
    container_name: healthguardian-sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
