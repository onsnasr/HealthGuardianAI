# Application Name
spring.application.name=healthguardian

# Server Configuration
server.port=8081
server.error.include-message=always
server.error.include-binding-errors=always

# Database Configuration (MySQL via PHPMyAdmin)
spring.datasource.url=jdbc:mysql://localhost:3306/healthguardian_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# Options: create | update | validate | none
# - create: DROPS all tables and recreates them (DELETES ALL DATA on restart) â ï¸
# - update: Updates schema but KEEPS existing data â (recommended for development)
# - validate: Only validates schema, no changes (recommended for production)
# - none: No schema management
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.healthguardian=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
