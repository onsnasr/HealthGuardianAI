# ===================================================================
# Test Configuration for HealthGuardian
# Uses H2 in-memory database instead of MySQL
# ===================================================================

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable email sending during tests
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@healthguardian.com
spring.mail.password=test

# JWT Configuration (same as production for consistency)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Logging
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.healthguardian=DEBUG

# Disable Spring Security in specific tests (will be overridden per test)
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
