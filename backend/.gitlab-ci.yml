variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository/

stages:
  - test
  - analysis
  - deploy

# ===================================================================
# STAGE 1: TESTS
# ===================================================================

tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - cd healthguardian
  script:
    - echo " Running 39 tests (unit + integration + functional)..."
    - mvn clean test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
  only:
    - main
    - merge_requests

# ===================================================================
# STAGE 2: ANALYSE DE CODE
# ===================================================================

code-coverage:
  stage: analysis
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd healthguardian
    - echo " Generating code coverage report with JaCoCo..."
    - mvn jacoco:report
  artifacts:
    paths:
      - target/site/jacoco/
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    - main
    - merge_requests

code-quality:
  stage: analysis
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd healthguardian
    - echo "Running code quality checks with Checkstyle..."
    - mvn checkstyle:checkstyle
  artifacts:
    paths:
      - target/checkstyle-result.xml
  allow_failure: true
  only:
    - main
    - merge_requests

sonarqube-check:
  stage: analysis
  image: maven:3.9-eclipse-temurin-17
  variables:
    # Utilisation de votre IP locale (Wi-Fi) pour être accessible par le Runner
    SONAR_HOST_URL: "http://192.168.1.198:9000"
    SONAR_TOKEN: "sqp_e3b604e497b3f2259531302eae2b49ca192a4218"
    SONAR_PROJECT_KEY: "healthguardian-backend"
  script:
    - cd healthguardian
    - echo "Running SonarQube analysis..."
    - mvn verify sonar:sonar -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN
  allow_failure: true
  only:
    - main
    - merge_requests

# ===================================================================
# STAGE 3: DEPLOY
# ===================================================================

docker-deploy:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - cd healthguardian
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USER" --password-stdin
  script:
    - docker build -t $DOCKER_HUB_USER/healthguardian-backend:latest .
    - docker push $DOCKER_HUB_USER/healthguardian-backend:latest
  only:
    - main