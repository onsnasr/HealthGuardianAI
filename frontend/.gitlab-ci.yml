stages:
  - deploy

deploy_to_docker_hub:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USER" --password-stdin
  script:
    - docker build -t "$DOCKER_HUB_USER/healthguardian-frontend:latest" .
    - docker push "$DOCKER_HUB_USER/healthguardian-frontend:latest"
  only:
    - main
